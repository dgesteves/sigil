name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir packages/sigil test
      - run: pnpm --dir packages/sigil build
      - name: Validate the catalog
        run: |
          if [ -n "$(find catalog -name sigil.yaml 2>/dev/null | head -1)" ]; then
            pnpm sigil validate catalog
          else
            echo "No capabilities in the catalog yet."
          fi
      - name: Spec schemas are up to date
        run: |
          pnpm --dir packages/sigil schemas
          git diff --exit-code -- spec/ || { echo "::error::spec/*.schema.json is stale. Run: pnpm --dir packages/sigil schemas"; exit 1; }

  site:
    name: Site tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir site test
      - name: Build the registry from the catalog
        run: pnpm --dir packages/sigil build && pnpm sigil registry --out registry.json --commit "$GITHUB_SHA"
      - name: Production build (refuses demo data)
        run: pnpm --dir site build

  scan:
    name: Scan the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may upload to code scanning.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/sigil build
      - name: sigil scan
        run: pnpm sigil scan catalog --sarif sigil-scan.sarif --fail-on high
      - name: Upload to code scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sigil-scan.sarif
          category: sigil-scan
