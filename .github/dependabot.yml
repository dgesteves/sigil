version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native (Go) compiler: tsdown's declaration build and editor tooling
      # still target the JS compiler API. Revisit when tsdown supports TS 7 declarations.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Stay on the types of the Node major the code is tested on (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same CodeQL version: separate PRs for each step fail CI ("All
      # steps in a workflow that use github/codeql-action must use the same version"). One PR per
      # release keeps every codeql-action step, upload-sarif included, on the same pin.
      codeql-action:
        patterns:
          - github/codeql-action
          - github/codeql-action/*
