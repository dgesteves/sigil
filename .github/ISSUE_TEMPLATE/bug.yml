name: Bug report
description: Something in the CLI, scanner, lab or site does not work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command you ran and its full output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: sigil 0.1.0, Node 24.11, macOS 26
