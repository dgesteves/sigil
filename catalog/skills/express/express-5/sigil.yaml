sigil: 1
id: express/express-5
type: skill
version: 1.0.0
name: Express 5
summary: Write, upgrade and harden Express 5.x APIs, including the route syntax and the silent 4-to-5 changes that still return 200.
description: >-
  Current knowledge for Express 5.3: path-to-regexp 8 route syntax (named wildcards, optional groups),
  the breaking changes that throw and the ones that silently change responses (res.send(status),
  res.json(obj, status), res.redirect('back'), the req.query getter and simple parser, urlencoded
  extended=false, req.body undefined), async error forwarding, JSON error handlers that never leak
  internals, and production defaults. Includes a grep-driven migration checklist from Express 4.
domains: [backend, security, migration]
lifecycle: [build, maintain, secure]
technologies: [express, nodejs, javascript, typescript]
license: MIT
authors:
  - github: dgesteves
payload:
  format: agent-skill
  entry: SKILL.md
targets: [claude-code, codex, cursor, github-copilot, gemini-cli, opencode]
permissions:
  network: []
  shell: [grep, npm ls, npm test, node]
  filesystem: write
  env: []
proof:
  suites: [express-5]
limitations:
  - Written and checked against express@5.3.0 (router 2.2, path-to-regexp 8.4, body-parser 2.4). Later 5.x releases may change details such as defaults or MIME types.
  - Covers Express itself. Third-party middleware (sessions, auth, rate limiting, helmet) is mentioned only where it interacts with Express 5 behaviour.
  - The migration greps are line-based and can miss calls split across lines; they narrow the search but do not replace reading the code.
  - Does not cover the view/template layer beyond noting that res.render is always asynchronous.
