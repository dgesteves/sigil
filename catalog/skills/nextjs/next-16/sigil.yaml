sigil: 1
id: nextjs/next-16
type: skill
version: 1.0.0
name: Next.js 16 App Router
summary: Next.js 16 as it behaves today - Cache Components, the right invalidation call, proxy.ts, safe server actions and 15 to 16 upgrades.
description: >-
  Teaches an agent the Next.js 16 App Router as measured on next 16.4.3 with next build and next
  start. It concentrates on what agents trained on Next 13-15 get wrong: the Cache Components model
  (cacheComponents with partialPrefetching, 'use cache', cacheLife, cacheTag, Suspense and the
  prerender build errors, removed segment configs), choosing updateTag, revalidateTag with a profile,
  revalidatePath or refresh by what the next request must show (revalidateTag 'max' serves one stale
  response, updateTag throws outside Server Actions), the 15 to 16 changes that build but misbehave
  (sync params, sitemap ids as Promises, images.qualities defaulting to 75, revalidateTag semantics),
  middleware renamed to a Node-only proxy.ts, and server actions as public endpoints whose .bind()
  arguments are client-controlled.
domains: [frontend, backend, security, migration]
lifecycle: [build, maintain, secure]
technologies: [nextjs, react, typescript, javascript, nodejs]
license: MIT
authors:
  - github: dgesteves
payload:
  format: agent-skill
  entry: SKILL.md
targets: [claude-code, codex, cursor, github-copilot, gemini-cli, opencode]
