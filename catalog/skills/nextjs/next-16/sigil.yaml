proof:
  suites: [nextjs-16]
limitations:
  - Written and verified against next 16.4.3 with React 19.3. A security release was announced for 2026-11-03 and later 16.x minors may change defaults; the docs in node_modules/next/dist/docs win when they disagree.
  - App Router only. The Pages Router, custom servers, static export and the Edge runtime are not covered beyond noting that middleware.ts is the way to keep Edge.
  - Cache behaviour was measured with the default in-memory cache handler on a single next start process. Serverless platforms, 'use cache remote' handlers and multi-instance deployments behave differently for runtime caching.
  - The proof suite drives pages and server actions over HTTP without a browser, so client-side router cache behaviour (stale times, prefetching, Activity state) is taught but not scored.
  - Partial Prefetching, Instant Navigations, ensureStatic and adapters are summarised, not taught in depth.
