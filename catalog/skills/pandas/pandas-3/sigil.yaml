limitations:
  - Written and checked against pandas 3.1.0 with NumPy 2.5.4. Later 3.x releases may enforce the 3.1 deprecations differently or add new defaults; check the release notes when the installed version is newer.
  - Covers the default NumPy-backed and str dtypes. ArrowDtype columns (dtype_backend="pyarrow"), nullable extension dtypes and Categorical internals are mentioned only where their behaviour changed.
  - The grep patterns are line-based and noisy; they narrow the audit but do not replace diffing outputs against pandas 2.3.
  - I/O engines (pyarrow, fastparquet, openpyxl, calamine, SQLAlchemy) are covered only for datetime units and string inference, not their own version changes.
  - Does not cover pandas-on-Spark, Modin, cuDF or Polars, which have their own semantics.
