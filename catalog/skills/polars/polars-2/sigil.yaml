sigil: 1
id: polars/polars-2
type: skill
version: 1.0.0
name: Polars 2
summary: Correct Polars 2 pipelines and 0.19/0.20/1.x ports, including the row-order, NaN, join and explode changes that return wrong data silently.
description: >-
  Teaches an agent current Polars (checked against polars 2.1.0 on Python 3.14): the lazy API with
  the streaming engine that LazyFrame.collect now uses by default, where row order is and is not
  kept (joins, group_by, sorts the optimizer drops before a join, and how to order last, shift and
  cum_sum with sort_by and over(order_by=...)), null versus NaN in aggregations and CSV input, full
  joins that keep two key columns, replace versus replace_strict, empty lists that explode to no
  rows, strict casts and is_in, string-to-date parsing and time zones. It also carries a porting
  guide from 0.19, 0.20 and 1.x that separates renames that raise from the changes that keep running
  with different output, including removal hints that lead to the wrong fix (how="full" for
  how="outer", len_chars for str.lengths, replace for map_dict, group_by().len() for count()).
