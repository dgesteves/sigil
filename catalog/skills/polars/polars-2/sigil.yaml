limitations:
  - Written and verified against polars 2.1.0 (polars-runtime-32) on CPython 3.14. Later 2.x releases may change defaults, especially around the streaming engine and SQL.
  - Covers the Python API. The Rust crate, the SQL interface beyond its engine and literal changes, Polars Cloud, GPU execution and plugins are out of scope.
  - Old-version behaviour was reproduced on 0.19.19, 0.20.31 and 1.44.2 only; intermediate 0.20 and 1.x releases may differ in details such as warning text.
  - Row-order findings come from the 2.1.0 optimizer and engines; Polars does not document an order for these operations, so the advice is to set order explicitly rather than rely on any observed order.
  - Interop with pandas, NumPy and PyArrow is covered only where Polars 2 changes it (Int128, Map, nan_to_null).
