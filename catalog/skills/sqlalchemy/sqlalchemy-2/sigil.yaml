proof:
  suites: [sqlalchemy-2]
limitations:
  - Written and verified against SQLAlchemy 2.1.6 with SQLite (sqlite3 and aiosqlite). PostgreSQL and MySQL notes are limited to API shape; dialect-specific locking, isolation levels and type behaviour are not covered.
  - The proof suite runs on SQLite, so it measures transaction outcomes, statement counts and loading behaviour, not concurrency, isolation or lock contention.
  - Alembic migrations, SQLModel and framework integrations (FastAPI, Flask-SQLAlchemy) are out of scope beyond the session and loading rules they share.
  - The 1.x upgrade guidance targets 1.4-era code; 1.3-only APIs that 1.4 had already removed are mentioned only where they still appear in code bases.
  - Grep patterns for backref-attached children are deliberately broad and line-based; they narrow the reading but do not replace it.
