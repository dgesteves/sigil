proof:
  suites: [angular-22]
limitations:
  - Written and verified against @angular/core 22.2.4 and @angular/cli 22.2.5. Angular ships a major every six months; check the CHANGELOG when the installed version is newer.
  - The proof suite runs TestBed in jsdom through ng test, so it measures change detection, signals, resources and HttpClient behaviour, not real-browser rendering, SSR or hydration.
  - Signal forms (stable in 22), @defer, SSR and hydration, animations, the router and Angular Material are only mentioned; they are not taught in depth or measured.
  - debounced() and resourceFromSnapshots are experimental in 22; their guidance may change in later minors.
  - Apps that still load zone.js (provideZoneChangeDetection) behave differently; the skill only covers how to leave that mode.
