  env: []
proof:
  suites: [aspnet-minimal-apis]
limitations:
  - Written and measured against .NET 10.0.14 (SDK 10.0.403). .NET 11 changes validation (async rules, localization, non-experimental attributes) and is not covered.
  - Covers minimal APIs. MVC controllers, Razor Pages and Blazor forms validate differently and are only mentioned where behaviour is shared.
  - Authentication coverage is cookie-centred; JWT bearer, OpenID Connect and ASP.NET Core Identity endpoints get short notes only.
  - OpenAPI document generation, rate limiting, output caching and Native AOT are out of scope.
  - The proof suite runs through TestServer, so it measures HTTP behaviour but not Kestrel-specific limits, HTTPS or reverse-proxy headers.
