# Sigil technology taxonomy.
#
# The controlled vocabulary for `technologies:` in sigil.yaml, and the signatures the Oracle uses to
# detect a repo's stack. `detect` keys are package ecosystems (exact package names) plus `files`
# (paths or simple globs that indicate the technology). Add entries freely; ids are permanent.
#
# kinds: language | runtime | framework | library | database | platform | infrastructure | tool |
#        ai-provider | ai-framework | protocol | practice

sigil: 1
technologies:
  # ── Languages ─────────────────────────────────────────────────────────────
  - { id: javascript, name: JavaScript, kind: language, detect: { files: [package.json] } }
  - { id: typescript, name: TypeScript, kind: language, detect: { npm: [typescript], files: [tsconfig.json] } }
  - { id: python, name: Python, kind: language, detect: { files: [pyproject.toml, requirements.txt, setup.py, Pipfile, uv.lock] } }
  - { id: java, name: Java, kind: language, detect: { files: [pom.xml, build.gradle, build.gradle.kts] } }
  - { id: csharp, name: 'C#', kind: language, detect: { files: ['*.csproj', '*.sln', global.json] } }
  - { id: cpp, name: C++, kind: language, detect: { files: [CMakeLists.txt, conanfile.txt, vcpkg.json] } }
  - { id: c, name: C, kind: language, detect: { files: [Makefile, meson.build] } }
  - { id: go, name: Go, kind: language, detect: { files: [go.mod] } }
  - { id: rust, name: Rust, kind: language, detect: { files: [Cargo.toml] } }
  - { id: php, name: PHP, kind: language, detect: { files: [composer.json] } }
  - { id: kotlin, name: Kotlin, kind: language, detect: { files: [build.gradle.kts, settings.gradle.kts] } }
