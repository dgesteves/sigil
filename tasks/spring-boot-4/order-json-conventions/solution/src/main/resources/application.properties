spring.application.name=orders-api

# docs/json-guidelines.md: snake_case names, null properties omitted. Money has its own
# serializer (com.acme.orders.json.MoneyJacksonComponent). Timestamps are already ISO 8601 UTC
# strings by default with Jackson 3.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
