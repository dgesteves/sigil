[project]
name = "orders-api"
version = "3.4.0"
description = "Order intake for the storefront and the mobile app"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
