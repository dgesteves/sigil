name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

# Never run two releases at once, and never cancel one half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write # npm exchanges the OIDC token for a short-lived publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # bundles npm 11, which trusted publishing needs (>= 11.5.1)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache restores in a job that can publish
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm ci
      # No token: npm uses the trusted publisher configured for release.yml and adds provenance.
      - run: npm publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
