sigil: 1
id: npm-trusted-publishing
title: Publish to npm from tags with trusted publishing
prompt: |
  I want releases of this package to go out from CI instead of my laptop. Please add a GitHub Actions
  workflow that publishes it to npm whenever we push a version tag like v1.5.0, and creates a GitHub
  release for that tag. The tests must pass before anything is published.

  On npmjs.com I've already set up a trusted publisher for the package: repository
  northwind-labs/unitwise, workflow file release.yml, no environment. I don't want any npm token stored
  in GitHub secrets. Follow the Actions conventions in CONTRIBUTING.md.
verify:
  command: node --test "test/hidden/*.test.mjs"
  timeoutSeconds: 120
protected:
  - test/convert.test.js
  - src/units.yaml
image: node:24-bookworm
setup: npm ci --ignore-scripts --no-audit --no-fund
timeoutSeconds: 900
tags: [github-actions, npm, oidc, release]
