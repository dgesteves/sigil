sigil: 1
id: customer-validation
title: Validate the create-customer request and paging parameters of a .NET 10 minimal API
prompt: |
  POST /api/customers (src/Parcels.Api/Customers) only checks the name and roughly the email, so
  bad imports keep creating customers with no billing address or broken contacts. Please add proper
  request validation. Invalid requests must get a 400 with standard validation problem details
  (application/problem+json with an `errors` map), listing every problem in one response, and
  nothing may be stored. The keys of `errors` are the field paths, e.g. `billingAddress.postcode`
  or `contacts[0].email` (the frontend matches them case-insensitively).

  Rules:
  - name: required, at most 100 characters
  - email: required, a valid email address
  - phone: optional, no rules for now
  - billingAddress: required. line1, city and postcode are required, postcode is at most 10
    characters, and countryCode is required and must be two uppercase letters (ISO 3166-1
    alpha-2, like PT). line2 is optional.
  - contacts: optional, at most 5, and each contact needs a name and a valid email

  Also validate the paging query on GET /api/customers: page must be at least 1, pageSize between
  1 and 100 (the defaults stay 1 and 20), with the same 400 response.

  We're on .NET 10. Don't add NuGet packages (they need a security review); keep the existing
  tests passing.
verify:
  command: dotnet test --project tests/Parcels.Tests
  timeoutSeconds: 180
protected:
  - tests/Parcels.Tests/*.cs
  - tests/Parcels.Tests/Parcels.Tests.csproj
  - global.json
  - nuget.config
image: mcr.microsoft.com/dotnet/sdk:10.0.403
setup: dotnet restore Parcels.slnx --locked-mode && dotnet build Parcels.slnx --no-restore
timeoutSeconds: 1200
tags: [aspnet-core, dotnet, csharp, minimal-apis, validation, problem-details]
