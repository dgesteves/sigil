[project]
name = "helpdesk"
version = "1.9.0"
description = "Ticket storage and workflow for the support desk"
requires-python = ">=3.14"
dependencies = ["sqlalchemy[asyncio]==2.1.6", "aiosqlite==0.22.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
