[package]
name = "inventory-api"
version = "0.4.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = { version = "0.1.5", features = ["channel"] }
tokio = { version = "1.54.1", features = ["test-util"] }
