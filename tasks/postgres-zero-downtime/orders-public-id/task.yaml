sigil: 1
id: orders-public-id
title: Add a backfilled, unique, NOT NULL public_id to a hot orders table
prompt: |
  We're going to stop exposing sequential order ids in URLs and emails. Add a `public_id` uuid
  column to orders:
  - every existing order gets one, and new orders get one automatically when the app doesn't set it;
  - it must be unique, and the column itself must be NOT NULL (our codegen reads nullability from
    the catalog).
  App code changes come in a follow-up PR; this one is only the migrations.

  orders has about 80M rows and is updated constantly (status changes from payments and
  fulfilment). The change must not block reads or writes on orders, and must not hold locks on
  orders (the table or its rows) for more than a few seconds at a time. Deploys only run
  `npm run migrate`, so everything has to happen in migrations.
verify:
  command: node --test test/migrate.test.ts test/schema.test.ts test/hidden/orders-public-id.test.ts
  timeoutSeconds: 120
protected:
  - test/*.test.ts
  - src/migrate.ts
  - migrations/0001_create_customers.sql
  - migrations/0002_create_orders.sql
  - migrations/0003_orders_notes.sql
image: node:24-bookworm
setup: npm ci --ignore-scripts --no-audit --no-fund
timeoutSeconds: 900
tags: [postgres, migrations, backfill, constraints, zero-downtime]
