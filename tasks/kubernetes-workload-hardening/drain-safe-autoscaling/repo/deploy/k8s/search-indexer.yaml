apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  labels:
    app.kubernetes.io/name: search-indexer
    app.kubernetes.io/part-of: tideway-search
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: search-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-indexer
        app.kubernetes.io/part-of: tideway-search
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: ghcr.io/tideway/search-api:5.3.1
          command: ["node", "src/indexer.js"]
          envFrom:
            - configMapRef:
                name: search-api
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
