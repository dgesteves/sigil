apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-api
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/part-of: ledgerline
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-api
