apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/part-of: ledgerline
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-api
        app.kubernetes.io/part-of: ledgerline
    spec:
      # Termination budget: 10 s preStop (load balancers catch up) + up to 45 s for in-flight
      # exports after SIGTERM, plus headroom.
      terminationGracePeriodSeconds: 65
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/ledgerline/ledger-api:3.8.2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          lifecycle:
            preStop:
              # Keep serving while ingress-nginx and kube-proxy drop this pod from their endpoints.
              # The image is distroless (no sh, no sleep binary), so an exec "sleep" would fail
              # instantly; the kubelet's built-in sleep action (GA in 1.34) needs nothing in the image.
              sleep:
                seconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
