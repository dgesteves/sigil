apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cleanup
  labels:
    app.kubernetes.io/name: nightly-cleanup
    app.kubernetes.io/part-of: parcelhub
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nightly-cleanup
            app.kubernetes.io/part-of: parcelhub
        spec:
          serviceAccountName: parcelhub
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ghcr.io/parcelhub/parcelhub:4.2.0
              command: ["node", "src/cleanup.js"]
              envFrom:
                - configMapRef:
                    name: parcelhub-config
                - secretRef:
                    name: parcelhub-db
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
