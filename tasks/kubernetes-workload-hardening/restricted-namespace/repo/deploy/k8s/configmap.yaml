apiVersion: v1
kind: ConfigMap
metadata:
  name: parcelhub-config
  labels:
    app.kubernetes.io/part-of: parcelhub
data:
  DB_HOST: parcelhub-db.data.svc.cluster.local
  DB_NAME: parcelhub
  QUEUE_URL: https://queue.internal.example.com/parcelhub-batches
  HTTPS_PROXY: http://egress-proxy.platform.svc.cluster.local:3128
  NO_PROXY: .svc,.cluster.local,10.0.0.0/8
  LABEL_RETENTION_DAYS: "90"
  LOG_LEVEL: info
